# Builds the portfolio on every push to main and saves the finished site to the `gh-pages` branch.
# One-time setup: repo Settings → Pages → Source: "Deploy from a branch", Branch: gh-pages / (root) → Save.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write # to push the built site to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # The site is served from https://<user>.github.io/<repo>/.
          # If you add a custom domain, change this to an empty string: BASE_PATH: ""
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Publish to the gh-pages branch
        run: |
          cd out
          touch .nojekyll # stops GitHub's Jekyll from hiding the _next/ folder
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
